```html
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#eeeee8;
    color:#464940;
    font-family:system-ui,"Microsoft YaHei",sans-serif
}
.app{
    max-width:1000px;
    margin:auto;
    padding-bottom:90px
}
header{
    padding:22px 20px;
    border-bottom:1px solid #d7d8ce;
    background:#eeeee8
}
h1{
    margin:0;
    font-size:22px
}
header p{
    margin:6px 0 0;
    color:#85897d;
    font-size:13px
}
.section{
    margin:14px 14px 0;
    background:#f8f8f3;
    border:1px solid #d9dad0;
    border-radius:16px;
    overflow:hidden
}
.title{
    padding:15px 17px;
    font-weight:600
}
.body{
    padding:0 17px 17px
}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 14px
}
.field{
    margin-top:14px
}
label{
    display:block;
    font-size:13px;
    color:#777b70;
    margin-bottom:7px
}
input,textarea{
    width:100%;
    border:1px solid #d5d7cc;
    background:#fffef9;
    border-radius:10px;
    padding:10px 12px;
    font:inherit;
    color:#444;
    outline:none
}
textarea{
    min-height:80px;
    resize:vertical;
    line-height:1.7
}
.sub{
    margin:18px 0 6px;
    font-size:14px;
    font-weight:600
}
.row{
    display:flex;
    gap:8px;
    margin-top:8px
}
.row input{
    flex:1
}
.del{
    width:36px;
    border:0;
    border-radius:8px;
    background:#e9e9e1;
    color:#777;
    font-size:18px
}
.add{
    margin-top:9px;
    border:1px dashed #aeb5a5;
    background:transparent;
    color:#69735f;
    border-radius:9px;
    padding:8px 12px
}
.bar{
    position:fixed;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    background:#45483f;
    padding:8px;
    border-radius:13px;
    display:flex;
    gap:8px
}
.bar button{
    border:0;
    border-radius:9px;
    padding:10px 15px
}
.primary{
    background:#9aa58c;
    color:white
}
@media(max-width:650px){
    .grid{
        grid-template-columns:1fr
    }
    .section{
        margin-left:8px;
        margin-right:8px
    }
}
</style>
</head>

<script>

function addList(id){
    let b=document.getElementById(id),
        r=document.createElement('div');

    r.className='row';

    r.innerHTML=
        '<input placeholder="填写内容">'+
        '<button class="del" onclick="this.parentElement.remove()">×</button>';

    b.appendChild(r);
}


function addPair(id){
    let b=document.getElementById(id),
        r=document.createElement('div');

    r.className='row';

    r.innerHTML=
        '<input placeholder="特质">'+
        '<input placeholder="描述">'+
        '<button class="del" onclick="this.parentElement.remove()">×</button>';

    b.appendChild(r);
}


[
    'identity',
    'build',
    'lifestyle',
    'work',
    'goals',
    'weakness',
    'likes',
    'dislikes',
    'skill_work',
    'skill_life',
    'skill_hobby',
    'habits'
].forEach(addList);


[
    'core_traits',
    'romantic_traits'
].forEach(addPair);


const v=id=>
    document.getElementById(id).value.trim();


const ls=id=>
    [...document.querySelectorAll('#'+id+' input')]
    .map(x=>x.value.trim())
    .filter(Boolean);


const ps=id=>
    [...document.querySelectorAll('#'+id+' .row')]
    .map(r=>
        [...r.querySelectorAll('input')]
        .map(x=>x.value.trim())
    )
    .filter(x=>x[0]||x[1]);


function q(s){
    return '"'+
        String(s)
        .replaceAll('\\','\\\\')
        .replaceAll('"','\\"')+
        '"';
}


function list(n,id,ind=''){
    let a=ls(id);

    return a.length
        ? n+':\n'+a.map(x=>ind+'  - '+x).join('\n')
        : n+':';
}


function pair(n,id,ind=''){
    let a=ps(id);

    return a.length
        ? n+':\n'+
          a.map(x=>
              ind+'  - '+x[0]+': '+q(x[1]||'')
          ).join('\n')
        : n+':';
}


function gen(){

return `char_name: ${v('char_name')}
Chinese name: ${v('chinese_name')}
Nickname: ${v('nickname')}
age: ${v('age')}
gender: ${v('gender')}
height: ${v('height')}
${list('identity','identity')}

background_story:
  童年(0-12岁): ${v('childhood')}
  少年(13-18岁): ${v('teen')}
  青年(19-35岁): ${v('young')}
  中年(35-至今): ${v('middle')}
  现状: ${v('current')}

appearance:
  hair: ${v('hair')}
  eyes: ${v('eyes')}
  skin: ${v('skin')}
  face_style: ${v('face_style')}
${list('build','build','  ')}

attire:
  business_formal: ${v('business_formal')}
  business_casual: ${v('business_casual')}
  casual_wear: ${v('casual_wear')}
  home_wear: ${v('home_wear')}

archetype: ${v('archetype')}

personality:
${pair('  core_traits','core_traits')}
${pair('  romantic_traits','romantic_traits')}

${list('lifestyle_behaviors','lifestyle')}
${list('work_behaviors','work')}

emotional_behaviors:
  angry: ${v('angry')}
  happy: ${v('happy')}

${list('goals','goals')}
${list('weakness','weakness')}
${list('likes','likes')}
${list('dislikes','dislikes')}

skills:
  - 工作: [${ls('skill_work').map(q).join(', ')}]
  - 生活: [${ls('skill_life').map(q).join(', ')}]
  - 爱好: [${ls('skill_hobby').map(q).join(', ')}]

NSFW_information:
  Sex_related traits:
    experiences: ${v('experiences')}
    sexual_orientation: ${v('orientation')}
    sexual_role: ${v('role')}
${list('    sexual_habits','habits')}
  Kinks: ${v('kinks')}
  Limits: ${v('limits')}`;

}


function preview(){

    let w=window.open('','_blank');

    w.document.write(
        '<pre style="white-space:pre-wrap;font:14px monospace;padding:20px">'+
        gen()
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')+
        '</pre>'
    );
}


function copyOut(){

    Android.copyText(gen());

}

</script>
