<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色卡工具</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eeeee8;color:#464940;font-family:system-ui,"Microsoft YaHei",sans-serif}
body{overflow:hidden}
.page{display:none;width:100%;height:100%}
.page.active{display:block}
#home{overflow:auto;padding:20px}
.home_box{max-width:760px;margin:0 auto;padding:16px 0 40px}
.home_title{padding:10px 4px 20px}
.home_title h1{margin:0;font-size:24px}
.home_title p{margin:7px 0 0;color:#85897d;font-size:13px}
.function_list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.function{min-height:170px;padding:22px;text-align:left;border:1px solid #d9dad0;border-radius:16px;background:#f8f8f3;color:#464940;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.function:hover{background:#f3f3ed;border-color:#cfd1c5}
.function:active{background:#e9e9e1}
.function_icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:auto;border-radius:12px;background:#e1e6dc;color:#69735f;font-size:22px}
.function strong{display:block;font-size:17px}
.function span{display:block;margin-top:7px;color:#85897d;font-size:13px;line-height:1.6}
.subpage{position:relative;background:#eeeee8}
.subpage_header{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #d9dad0;background:#eeeee8}
.back_btn{width:38px;height:38px;border:0;border-radius:10px;background:#e9e9e1;color:#555a50;font-size:22px;cursor:pointer}
.subpage_title{font-size:16px;font-weight:600}
.tool_frame{display:block;width:100%;height:calc(100% - 58px);border:0;background:#eeeee8}
@media(max-width:650px){#home{padding:14px}.home_box{padding-top:6px}.function_list{grid-template-columns:1fr;gap:12px}.function{min-height:130px;padding:18px}.subpage_header{height:54px}.tool_frame{height:calc(100% - 54px)}}
</style>
</head>
<body>
<section id="homePage" class="page active">
  <div id="home">
    <div class="home_box">
      <div class="home_title"><h1>角色卡工具</h1><p>选择功能</p></div>
      <div class="function_list">
        <button class="function" type="button" onclick="openPage('editorPage')"><div class="function_icon">✎</div><strong>角色卡编辑器</strong><span>创建、编辑角色信息，并生成角色卡。</span></button>
        <button class="function" type="button" onclick="openPage('importPage')"><div class="function_icon">↓</div><strong>角色卡导入</strong><span>导入 JSON / PNG 角色卡并查看卡片内容。</span></button>
      </div>
    </div>
  </div>
</section>
<section id="editorPage" class="page subpage">
  <div class="subpage_header"><button class="back_btn" type="button" onclick="goHome()">‹</button><div class="subpage_title">角色卡编辑器</div></div>
  <iframe id="editorFrame" class="tool_frame" title="角色卡编辑器"></iframe>
</section>
<section id="importPage" class="page subpage">
  <div class="subpage_header"><button class="back_btn" type="button" onclick="goHome()">‹</button><div class="subpage_title">角色卡导入</div></div>
  <iframe id="importFrame" class="tool_frame" title="角色卡导入"></iframe>
</section>
<script>
let currentPage = 'homePage';
let loaded = false;


/* =========================================================
   角色卡编辑器：单行输入框自动向下展开
   ========================================================= */

const EDITOR_GROW_PATCH = `
<style>
/* =========================
   单行输入框
   默认一行，内容变多后自动换行并向下展开
   ========================= */

.grow_input{
    min-height:40px !important;
    height:40px;
    overflow:hidden !important;
    resize:none !important;
    white-space:pre-wrap !important;
    overflow-wrap:anywhere !important;
    line-height:1.7 !important;
    transition:none !important;
}

.row .grow_input{
    flex:1 1 auto !important;
    min-width:0 !important;
}

.main_entry_header{
    align-items:flex-start !important;
}

.main_entry_name.grow_input{
    flex:1 1 auto !important;
    min-width:0 !important;
}


/* =========================
   原本就是多行的 textarea
   也改成自动向下展开
   ========================= */

textarea{
    overflow:hidden !important;
    resize:none !important;
    overflow-wrap:anywhere !important;
}


/* 手机端 */
@media(max-width:650px){

    .grow_input{
        min-height:40px !important;
        height:40px;
    }

    .row{
        align-items:flex-start;
    }

}
</style>

<script>
(function(){

    /* =====================================================
       自动调整高度
       ===================================================== */

    function resizeTextarea(el){

        if(!el){
            return;
        }

        if(
            el.tagName !== 'TEXTAREA' &&
            !el.classList.contains('grow_input')
        ){
            return;
        }

        el.style.height = 'auto';

        const height = Math.max(
            el.scrollHeight,
            40
        );

        el.style.height = height + 'px';
    }


    function resizeAll(){

        document
            .querySelectorAll(
                'textarea, .grow_input'
            )
            .forEach(
                resizeTextarea
            );
    }


    /* =====================================================
       输入时自动展开
       ===================================================== */

    document.addEventListener(
        'input',
        function(e){

            const el = e.target;

            if(
                el.tagName === 'TEXTAREA' ||
                el.classList.contains('grow_input')
            ){

                resizeTextarea(el);

            }

        }
    );


    /* =====================================================
       把原来的单行 input 转成可向下展开的 textarea
       ===================================================== */

    function convertInput(input){

        if(
            !input ||
            input.tagName !== 'INPUT'
        ){
            return;
        }

        /*
         * 角色卡编辑器里的 input 都是文本输入框。
         * 不处理特殊类型，避免影响其他控件。
         */

        const type =
            (
                input.getAttribute('type') ||
                'text'
            ).toLowerCase();

        if(
            type !== 'text' &&
            type !== ''
        ){
            return;
        }


        /* 已经转换过 */
        if(
            input.dataset.growConverted === '1'
        ){
            return;
        }


        const textarea =
            document.createElement(
                'textarea'
            );


        /* =================================================
           保留原来的属性
           ================================================= */

        [...input.attributes].forEach(
            attr => {

                /*
                 * textarea 不需要 type
                 */
                if(
                    attr.name === 'type'
                ){
                    return;
                }

                /*
                 * value 单独处理
                 */
                if(
                    attr.name === 'value'
                ){
                    return;
                }

                textarea.setAttribute(
                    attr.name,
                    attr.value
                );

            }
        );


        textarea.classList.add(
            'grow_input'
        );


        textarea.rows = 1;


        /*
         * input 的 value 是 property，
         * 不是必须存在于 attribute。
         */
        textarea.value =
            input.value || '';


        /*
         * 保留一些状态
         */
        if(
            input.disabled
        ){
            textarea.disabled = true;
        }

        if(
            input.readOnly
        ){
            textarea.readOnly = true;
        }


        /*
         * 标记
         */
        textarea.dataset.growConverted =
            '1';


        input.parentNode.replaceChild(
            textarea,
            input
        );


        resizeTextarea(
            textarea
        );

    }


    /* =====================================================
       让原来代码里的
       querySelectorAll('#xxx input')
       在 input 被替换后仍然能正常找到 textarea
       ===================================================== */

    const originalQSA =
        Element.prototype.querySelectorAll;


    Element.prototype.querySelectorAll =
        function(selector){

            const result =
                originalQSA.call(
                    this,
                    selector
                );


            /*
             * 原角色卡代码大量使用：
             *
             * '#identity input'
             * '#core_traits input'
             * '.main_entry_list input'
             *
             * input 转成 textarea 后，
             * 原来的查询会失效。
             *
             * 所以只针对「纯 input 查询」
             * 自动补查 textarea。
             */

            if(
                typeof selector === 'string' &&
                selector.indexOf('input') !== -1 &&
                selector.indexOf('textarea') === -1
            ){

                const textareaSelector =
                    selector.replace(
                        /input/g,
                        'textarea'
                    );


                const textareaResult =
                    originalQSA.call(
                        this,
                        textareaSelector
                    );


                if(
                    textareaResult.length
                ){

                    /*
                     * 合并两个结果。
                     * 保留 NodeList 形态不方便，
                     * 这里直接返回数组。
                     *
                     * 你的原代码只使用：
                     * length / forEach / map / spread
                     * 因此可以正常工作。
                     */

                    if(
                        result.length
                    ){

                        return [
                            ...result,
                            ...textareaResult
                        ];

                    }

                    return textareaResult;

                }

            }


            return result;

        };


    /* =====================================================
       自动监视动态添加的 input
       ===================================================== */

    const observer =
        new MutationObserver(
            function(mutations){

                let needResize = false;

                mutations.forEach(
                    mutation => {

                        mutation.addedNodes.forEach(
                            node => {

                                if(
                                    node.nodeType !== 1
                                ){
                                    return;
                                }


                                /* 自身就是 input */
                                if(
                                    node.matches &&
                                    node.matches('input')
                                ){

                                    convertInput(
                                        node
                                    );

                                    needResize = true;

                                }


                                /* 子元素 input */
                                if(
                                    node.querySelectorAll
                                ){

                                    node
                                        .querySelectorAll(
                                            'input'
                                        )
                                        .forEach(
                                            convertInput
                                        );

                                    node
                                        .querySelectorAll(
                                            'textarea'
                                        )
                                        .forEach(
                                            resizeTextarea
                                        );

                                    needResize = true;

                                }

                            }
                        );

                    }
                );


                if(
                    needResize
                ){

                    setTimeout(
                        resizeAll,
                        0
                    );

                }

            }
        );


    observer.observe(
        document.body,
        {
            childList:true,
            subtree:true
        }
    );


    /* =====================================================
       初始转换
       ===================================================== */

    document
        .querySelectorAll(
            'input'
        )
        .forEach(
            convertInput
        );


    document
        .querySelectorAll(
            'textarea'
        )
        .forEach(
            resizeTextarea
        );


    /*
     * loadData() 已经在原编辑器脚本最后执行完，
     * 所以这里再次撑开一次。
     */
    setTimeout(
        resizeAll,
        0
    );

    setTimeout(
        resizeAll,
        100
    );

    setTimeout(
        resizeAll,
        300
    );

})();
<\/script>
`;


/* =========================================================
   打开页面
   ========================================================= */

function openPage(id){

    document
        .querySelectorAll('.page')
        .forEach(
            x => x.classList.remove('active')
        );


    document
        .getElementById(id)
        .classList.add('active');


    currentPage = id;


    if(!loaded){

        /*
         * 这里只给「角色卡编辑器」注入自动展开功能。
         * IMPORT_HTML 完全不修改。
         */

        const editorHTML =
            EDITOR_HTML.replace(
                '</body>',
                EDITOR_GROW_PATCH +
                '</body>'
            );


        document
            .getElementById('editorFrame')
            .srcdoc =
                editorHTML;


        document
            .getElementById('importFrame')
            .srcdoc =
                IMPORT_HTML;


        loaded = true;

    }

}


/* =========================================================
   返回主页
   ========================================================= */

function goHome(){

    document
        .querySelectorAll('.page')
        .forEach(
            x => x.classList.remove('active')
        );


    document
        .getElementById('homePage')
        .classList.add('active');


    currentPage = 'homePage';

}


/* =========================================================
   Android 返回键调用
   ========================================================= */

window.goBackToHome =
    function(){

        if(
            currentPage ===
            'homePage'
        ){

            return false;

        }

        goHome();

        return true;

    };

</script>
</script>
</body>
</html>
