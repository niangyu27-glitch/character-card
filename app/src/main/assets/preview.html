<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色卡编辑器</title>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    background:#eeeee8;
    color:#464940;
    font-family:system-ui,"Microsoft YaHei",sans-serif
}

.app{
    max-width:1000px;
    margin:auto;
    padding-bottom:90px
}

header{
    padding:22px 20px;
    border-bottom:1px solid #d7d8ce;
    background:#eeeee8
}

h1{
    margin:0;
    font-size:22px
}

header p{
    margin:6px 0 0;
    color:#85897d;
    font-size:13px
}

.section{
    margin:14px 14px 0;
    background:#f8f8f3;
    border:1px solid #d9dad0;
    border-radius:16px;
    overflow:hidden
}

.title{
    padding:15px 17px;
    font-weight:600
}

.body{
    padding:0 17px 17px
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 14px
}

.field{
    margin-top:14px
}

label{
    display:block;
    font-size:13px;
    color:#777b70;
    margin-bottom:7px
}

.input_help{
    margin:6px 0 0;
    color:#85897d;
    font-size:12px;
    line-height:1.6
}

input,
textarea{
    width:100%;
    border:1px solid #d5d7cc;
    background:#fffef9;
    border-radius:10px;
    padding:10px 12px;
    font:inherit;
    color:#444;
    outline:none
}

textarea{
    min-height:80px;
    resize:vertical;
    line-height:1.7
}

.sub{
    margin:18px 0 6px;
    font-size:14px;
    font-weight:600
}

.row{
    display:flex;
    gap:8px;
    margin-top:8px
}

.row input{
    flex:1
}

.del{
    width:36px;
    flex:0 0 36px;
    border:0;
    border-radius:8px;
    background:#e9e9e1;
    color:#777;
    font-size:18px
}

.add{
    margin-top:9px;
    border:1px dashed #aeb5a5;
    background:transparent;
    color:#69735f;
    border-radius:9px;
    padding:8px 12px
}

/* 自定义大条目 */

.main_entry{
    margin-top:12px;
    padding:12px;
    border:1px solid #d9dad0;
    border-radius:12px;
    background:#fffef9
}

.main_entry_header{
    display:flex;
    align-items:center;
    gap:7px
}

.main_entry_name{
    flex:1;
    min-width:0;
    font-weight:600
}

.main_entry_move{
    width:34px;
    height:36px;
    flex:0 0 34px;
    padding:0;
    border:0;
    border-radius:8px;
    background:#e9e9e1;
    color:#69705f;
    font-size:16px;
    line-height:36px;
    text-align:center
}

.main_entry_move:active{
    background:#dddeda
}

.main_entry_delete{
    height:36px;
    padding:0 11px;
    border:0;
    border-radius:8px;
    background:#e9e9e1;
    color:#777
}

.main_entry_list{
    margin-top:10px
}

.add_main_entry{
    margin-top:10px;
    border:1px dashed #aeb5a5;
    background:transparent;
    color:#69735f;
    border-radius:9px;
    padding:9px 13px
}

/* 底栏 */

.bar{
    position:fixed;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    background:#45483f;
    padding:8px;
    border-radius:13px;
    display:flex;
    gap:8px;
    z-index:100
}

.bar button{
    border:0;
    border-radius:9px;
    padding:10px 15px
}

.primary{
    background:#9aa58c;
    color:white
}

/* 预览层 */

#preview_overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#eeeee8;
    overflow:auto
}

.preview_box{
    min-height:100%;
    display:flex;
    flex-direction:column
}

.preview_header{
    position:sticky;
    top:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    background:#f8f8f3;
    border-bottom:1px solid #d9dad0;
    font-weight:600
}

.preview_close{
    width:36px;
    height:36px;
    padding:0;
    border:0;
    border-radius:10px;
    background:#e9e9e1;
    color:#555;
    font-size:25px;
    line-height:36px;
    text-align:center
}

.preview_content{
    margin:0;
    padding:20px;
    white-space:pre-wrap;
    word-break:break-word;
    font:14px/1.8 monospace;
    color:#464940
}

/* 手机端 */

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr
    }

    .section{
        margin-left:8px;
        margin-right:8px
    }

    .bar{
        bottom:10px
    }

    .bar button{
        padding:10px 13px
    }

    .preview_content{
        padding:16px;
        font-size:13px
    }

    .main_entry_header{
        flex-wrap:wrap
    }

    .main_entry_name{
        flex-basis:100%
    }

    .main_entry_move,
    .main_entry_delete{
        margin-top:4px
    }
}
</style>
</head>

<script>
function addList(id){
    const b = document.getElementById(id);
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = '<input placeholder="填写内容"><button class="del" onclick="this.parentElement.remove();saveData()">×</button>';
    b.appendChild(r);
    saveData();
}

function addPair(id){
    const b = document.getElementById(id);
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = '<input placeholder="特质"><input placeholder="描述"><button class="del" onclick="this.parentElement.remove();saveData()">×</button>';
    b.appendChild(r);
    saveData();
}

function addMainEntry(savedName = '', savedItems = []){
    const container = document.getElementById('custom_entries');
    const entry = document.createElement('div');
    entry.className = 'main_entry';
    entry.innerHTML = `
        <div class="main_entry_header">
            <input class="main_entry_name" placeholder="大条目名称，例如 character" value="">
            <button class="main_entry_move" type="button" title="上移">↑</button>
            <button class="main_entry_move" type="button" title="下移">↓</button>
            <button class="main_entry_delete" type="button">删除</button>
        </div>
        <div class="main_entry_list"></div>
        <button class="add" type="button">＋ 添加</button>
    `;
    const nameInput = entry.querySelector('.main_entry_name');
    const moveButtons = entry.querySelectorAll('.main_entry_move');
    const deleteButton = entry.querySelector('.main_entry_delete');
    const listBox = entry.querySelector('.main_entry_list');
    const addButton = entry.querySelector('.add');
    nameInput.value = savedName || '';
    moveButtons[0].onclick = function(){
        const previous = entry.previousElementSibling;
        if(previous){
            container.insertBefore(entry, previous);
            saveData();
        }
    };
    moveButtons[1].onclick = function(){
        const next = entry.nextElementSibling;
        if(next){
            container.insertBefore(next, entry);
            saveData();
        }
    };
    deleteButton.onclick = function(){
        entry.remove();
        saveData();
    };
    addButton.onclick = function(){
        addMainItem(listBox);
        saveData();
    };
    container.appendChild(entry);
    if(Array.isArray(savedItems) && savedItems.length){
        savedItems.forEach(item => { addMainItem(listBox, item); });
    }else{
        addMainItem(listBox);
    }
    nameInput.addEventListener('input', saveData);
    saveData();
}

function addMainItem(container, value = ''){
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<input placeholder="填写内容"><button class="del" type="button">×</button>';
    const input = row.querySelector('input');
    const deleteButton = row.querySelector('.del');
    input.value = value || '';
    deleteButton.onclick = function(){
        row.remove();
        saveData();
    };
    container.appendChild(row);
    input.addEventListener('input', saveData);
}

[
    'identity','social_status','build','lifestyle','work','goals','weakness','likes','dislikes','skill_work','skill_life','skill_hobby','habits'
].forEach(id => addList(id));

['core_traits','romantic_traits'].forEach(id => addPair(id));

const v = id => document.getElementById(id).value.trim();

const ls = id => [...document.querySelectorAll('#' + id + ' input')].map(x => x.value.trim()).filter(Boolean);

const ps = id => [...document.querySelectorAll('#' + id + ' .row')].map(r => [...r.querySelectorAll('input')].map(x => x.value.trim())).filter(x => x[0] || x[1]);

function q(s){
    return '"' + String(s).replaceAll('\\','\\\\').replaceAll('"','\\"') + '"';
}

function list(n,id,ind=''){
    const a = ls(id);
    return a.length ? n + ':\n' + a.map(x => ind + '  - ' + x).join('\n') : n + ':';
}

function pair(n,id,ind=''){
    const a = ps(id);
    return a.length ? n + ':\n' + a.map(x => ind + '  - ' + x[0] + ': ' + q(x[1] || '')).join('\n') : n + ':';
}

function customEntries(){
    const entries = [...document.querySelectorAll('#custom_entries .main_entry')];
    return entries.map(entry => {
        const name = entry.querySelector('.main_entry_name').value.trim();
        const items = [...entry.querySelectorAll('.main_entry_list input')].map(input => input.value.trim()).filter(Boolean);
        return {name,items};
    }).filter(entry => entry.name || entry.items.length);
}

function customEntriesYAML(){
    const entries = customEntries();
    if(!entries.length) return '';
    return entries.map(entry => {
        if(entry.items.length){
            return entry.name + ':\n' + entry.items.map(item => '  - ' + item).join('\n');
        }
        return entry.name + ':';
    }).join('\n\n');
}

function gen(){
    const custom = customEntriesYAML();
    return `char_name: ${v('char_name')}
Chinese name: ${v('chinese_name')}
Nickname: ${v('nickname')}
age: ${v('age')}
gender: ${v('gender')}
height: ${v('height')}
${list('identity','identity')}

background_story:
  童年(0-12岁): ${v('childhood')}
  少年(13-18岁): ${v('teen')}
  青年(19-35岁): ${v('young')}
  中年(35-至今): ${v('middle')}
  现状: ${v('current')}

${list('social_status','social_status')}

appearance:
  hair: ${v('hair')}
  eyes: ${v('eyes')}
  skin: ${v('skin')}
  face_style: ${v('face_style')}
${list('build','build','  ')}

attire:
  business_formal: ${v('business_formal')}
  business_casual: ${v('business_casual')}
  casual_wear: ${v('casual_wear')}
  home_wear: ${v('home_wear')}

archetype: ${v('archetype')}

personality:
${pair('  core_traits','core_traits')}
${pair('  romantic_traits','romantic_traits')}

${list('lifestyle_behaviors','lifestyle')}
${list('work_behaviors','work')}

emotional_behaviors:
  angry: ${v('angry')}
  happy: ${v('happy')}

${list('goals','goals')}
${list('weakness','weakness')}
${list('likes','likes')}
${list('dislikes','dislikes')}

skills:
  - 工作: [${ls('skill_work').map(q).join(', ')}]
  - 生活: [${ls('skill_life').map(q).join(', ')}]
  - 爱好: [${ls('skill_hobby').map(q).join(', ')}]

NSFW_information:
  Sex_related traits:
    experiences: ${v('experiences')}
    sexual_orientation: ${v('orientation')}
    sexual_role: ${v('role')}
${list('    sexual_habits','habits')}
  Kinks: ${v('kinks')}
  Limits: ${v('limits')}${custom ? '\n\n' + custom : ''}`;
}

const SAVE_KEY = 'character_card_editor_data_v1';

function saveData(){
    const data = {};
    document.querySelectorAll('input, textarea').forEach(el => {
        if(el.id){ data[el.id] = el.value; }
    });
    [
        'identity','social_status','build','lifestyle','work','goals','weakness','likes','dislikes','skill_work','skill_life','skill_hobby','habits'
    ].forEach(id => {
        data[id] = [...document.querySelectorAll('#' + id + ' input')].map(input => input.value);
    });
    ['core_traits','romantic_traits'].forEach(id => {
        data[id] = [...document.querySelectorAll('#' + id + ' .row')].map(row => [...row.querySelectorAll('input')].map(input => input.value));
    });
    data.custom_entries = customEntries();
    try{
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }catch(e){
        console.error('角色卡数据保存失败:', e);
    }
}

function loadData(){
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    try{
        const data = JSON.parse(raw);
        document.querySelectorAll('input, textarea').forEach(el => {
            if(el.id && Object.prototype.hasOwnProperty.call(data, el.id) && typeof data[el.id] === 'string'){
                el.value = data[el.id];
            }
        });
        [
            'identity','social_status','build','lifestyle','work','goals','weakness','likes','dislikes','skill_work','skill_life','skill_hobby','habits'
        ].forEach(id => {
            if(!Array.isArray(data[id])) return;
            const box = document.getElementById(id);
            box.innerHTML = '';
            data[id].forEach(value => {
                addList(id);
                const inputs = box.querySelectorAll('input');
                inputs[inputs.length - 1].value = value;
            });
        });
        ['core_traits','romantic_traits'].forEach(id => {
            if(!Array.isArray(data[id])) return;
            const box = document.getElementById(id);
            box.innerHTML = '';
            data[id].forEach(pair => {
                addPair(id);
                const rows = box.querySelectorAll('.row');
                const row = rows[rows.length - 1];
                const inputs = row.querySelectorAll('input');
                inputs[0].value = pair[0] || '';
                inputs[1].value = pair[1] || '';
            });
        });
        const customContainer = document.getElementById('custom_entries');
        customContainer.innerHTML = '';
        if(Array.isArray(data.custom_entries)){
            data.custom_entries.forEach(entry => {
                addMainEntry(entry.name || '', Array.isArray(entry.items) ? entry.items : []);
            });
        }
    }catch(e){
        console.error('角色卡数据恢复失败:', e);
    }
}

document.addEventListener('input', saveData);
document.addEventListener('change', saveData);
document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){ saveData(); }
});
window.addEventListener('pagehide', saveData);
window.addEventListener('beforeunload', saveData);

function preview(){
    const old = document.getElementById('preview_overlay');
    if(old){ old.remove(); }
    saveData();
    const overlay = document.createElement('div');
    overlay.id = 'preview_overlay';
    overlay.innerHTML = `
        <div class="preview_box">
            <div class="preview_header">
                <span>角色卡预览</span>
                <button class="preview_close" onclick="closePreview()" aria-label="关闭预览">×</button>
            </div>
            <pre class="preview_content"></pre>
        </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('.preview_content').textContent = gen();
}

function closePreview(){
    const overlay = document.getElementById('preview_overlay');
    if(overlay){ overlay.remove(); }
}

function copyOut(){
    saveData();
    if(window.Android && typeof Android.copyText === 'function'){
        Android.copyText(gen());
        return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(gen()).then(function(){
            alert('角色卡已复制');
        }).catch(function(){
            fallbackCopy(gen());
        });
        return;
    }
    fallbackCopy(gen());
}

function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
        document.execCommand('copy');
        alert('角色卡已复制');
    }catch(e){
        alert('复制失败，请手动复制预览内容');
    }
    ta.remove();
}

loadData();
</script>
