<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色卡工具</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eeeee8;color:#464940;font-family:system-ui,"Microsoft YaHei",sans-serif}
body{overflow:hidden}
.page{display:none;width:100%;height:100%}
.page.active{display:block}
#home{overflow:auto;padding:20px}
.home_box{max-width:760px;margin:0 auto;padding:16px 0 40px}
.home_title{padding:10px 4px 20px}
.home_title h1{margin:0;font-size:24px}
.home_title p{margin:7px 0 0;color:#85897d;font-size:13px}
.function_list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.function{min-height:170px;padding:22px;text-align:left;border:1px solid #d9dad0;border-radius:16px;background:#f8f8f3;color:#464940;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.function:hover{background:#f3f3ed;border-color:#cfd1c5}
.function:active{background:#e9e9e1}
.function_icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:auto;border-radius:12px;background:#e1e6dc;color:#69735f;font-size:22px}
.function strong{display:block;font-size:17px}
.function span{display:block;margin-top:7px;color:#85897d;font-size:13px;line-height:1.6}
.subpage{position:relative;background:#eeeee8}
.subpage_header{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #d9dad0;background:#eeeee8}
.back_btn{width:38px;height:38px;border:0;border-radius:10px;background:#e9e9e1;color:#555a50;font-size:22px;cursor:pointer}
.subpage_title{font-size:16px;font-weight:600}
.tool_frame{display:block;width:100%;height:calc(100% - 58px);border:0;background:#eeeee8}
@media(max-width:650px){#home{padding:14px}.home_box{padding-top:6px}.function_list{grid-template-columns:1fr;gap:12px}.function{min-height:130px;padding:18px}.subpage_header{height:54px}.tool_frame{height:calc(100% - 54px)}}
</style>
</head>
<body>
<section id="homePage" class="page active">
  <div id="home">
    <div class="home_box">
      <div class="home_title"><h1>角色卡工具</h1><p>选择功能</p></div>
      <div class="function_list">
        <button class="function" type="button" onclick="openPage('editorPage')"><div class="function_icon">✎</div><strong>角色卡编辑器</strong><span>创建、编辑角色信息，并生成角色卡。</span></button>
        <button class="function" type="button" onclick="openPage('importPage')"><div class="function_icon">↓</div><strong>角色卡导入</strong><span>导入 JSON / PNG 角色卡并查看卡片内容。</span></button>
      </div>
    </div>
  </div>
</section>
<section id="editorPage" class="page subpage">
  <div class="subpage_header"><button class="back_btn" type="button" onclick="goHome()">‹</button><div class="subpage_title">角色卡编辑器</div></div>
  <iframe id="editorFrame" class="tool_frame" title="角色卡编辑器"></iframe>
</section>
<section id="importPage" class="page subpage">
  <div class="subpage_header"><button class="back_btn" type="button" onclick="goHome()">‹</button><div class="subpage_title">角色卡导入</div></div>
  <iframe id="importFrame" class="tool_frame" title="角色卡导入"></iframe>
</section>
<script>
const EDITOR_HTML="<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>角色卡编辑器</title>\n\n<style>\n*{\n    box-sizing:border-box\n}\n\nbody{\n    margin:0;\n    background:#eeeee8;\n    color:#464940;\n    font-family:system-ui,\"Microsoft YaHei\",sans-serif\n}\n\n.app{\n    max-width:1000px;\n    margin:auto;\n    padding-bottom:90px\n}\n\nheader{\n    padding:22px 20px;\n    border-bottom:1px solid #d7d8ce;\n    background:#eeeee8\n}\n\nh1{\n    margin:0;\n    font-size:22px\n}\n\nheader p{\n    margin:6px 0 0;\n    color:#85897d;\n    font-size:13px\n}\n\n.section{\n    margin:14px 14px 0;\n    background:#f8f8f3;\n    border:1px solid #d9dad0;\n    border-radius:16px;\n    overflow:hidden\n}\n\n.title{\n    padding:15px 17px;\n    font-weight:600\n}\n\n.body{\n    padding:0 17px 17px\n}\n\n.grid{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:0 14px\n}\n\n.field{\n    margin-top:14px\n}\n\nlabel{\n    display:block;\n    font-size:13px;\n    color:#777b70;\n    margin-bottom:7px\n}\n\n.field_hint{\n    margin:6px 2px 0;\n    color:#85897d;\n    font-size:12px;\n    line-height:1.6\n}\n\ninput,\ntextarea{\n    width:100%;\n    border:1px solid #d5d7cc;\n    background:#fffef9;\n    border-radius:10px;\n    padding:10px 12px;\n    font:inherit;\n    color:#444;\n    outline:none\n}\n\ntextarea{\n    min-height:80px;\n    resize:vertical;\n    line-height:1.7\n}\n\n.sub{\n    margin:18px 0 6px;\n    font-size:14px;\n    font-weight:600\n}\n\n.row{\n    display:flex;\n    gap:8px;\n    margin-top:8px\n}\n\n.row input{\n    flex:1\n}\n\n.del{\n    width:36px;\n    flex:0 0 36px;\n    border:0;\n    border-radius:8px;\n    background:#e9e9e1;\n    color:#777;\n    font-size:18px\n}\n\n.add{\n    margin-top:9px;\n    border:1px dashed #aeb5a5;\n    background:transparent;\n    color:#69735f;\n    border-radius:9px;\n    padding:8px 12px\n}\n\n\n/* =========================\n   自定义大条目\n   ========================= */\n\n.main_entry{\n    margin-top:12px;\n    padding:12px;\n    border:1px solid #d9dad0;\n    border-radius:12px;\n    background:#fffef9\n}\n\n.main_entry_header{\n    display:flex;\n    align-items:center;\n    gap:7px\n}\n\n.main_entry_name{\n    flex:1;\n    min-width:0;\n    font-weight:600\n}\n\n.main_entry_move{\n    width:34px;\n    height:36px;\n    flex:0 0 34px;\n    padding:0;\n    border:0;\n    border-radius:8px;\n    background:#e9e9e1;\n    color:#69705f;\n    font-size:16px;\n    line-height:36px;\n    text-align:center\n}\n\n.main_entry_move:active{\n    background:#dddeda\n}\n\n.main_entry_delete{\n    height:36px;\n    padding:0 11px;\n    border:0;\n    border-radius:8px;\n    background:#e9e9e1;\n    color:#777\n}\n\n.main_entry_list{\n    margin-top:10px\n}\n\n.add_main_entry{\n    margin-top:10px;\n    border:1px dashed #aeb5a5;\n    background:transparent;\n    color:#69735f;\n    border-radius:9px;\n    padding:9px 13px\n}\n\n\n/* =========================\n   底栏\n   ========================= */\n\n.bar{\n    position:fixed;\n    bottom:14px;\n    left:50%;\n    transform:translateX(-50%);\n    background:#45483f;\n    padding:8px;\n    border-radius:13px;\n    display:flex;\n    gap:8px;\n    z-index:100\n}\n\n.bar button{\n    border:0;\n    border-radius:9px;\n    padding:10px 15px\n}\n\n.primary{\n    background:#9aa58c;\n    color:white\n}\n\n\n/* =========================\n   预览层\n   ========================= */\n\n#preview_overlay{\n    position:fixed;\n    inset:0;\n    z-index:9999;\n    background:#eeeee8;\n    overflow:auto\n}\n\n.preview_box{\n    min-height:100%;\n    display:flex;\n    flex-direction:column\n}\n\n.preview_header{\n    position:sticky;\n    top:0;\n    z-index:2;\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    padding:16px 18px;\n    background:#f8f8f3;\n    border-bottom:1px solid #d9dad0;\n    font-weight:600\n}\n\n.preview_close{\n    width:36px;\n    height:36px;\n    padding:0;\n    border:0;\n    border-radius:10px;\n    background:#e9e9e1;\n    color:#555;\n    font-size:25px;\n    line-height:36px;\n    text-align:center\n}\n\n.preview_content{\n    margin:0;\n    padding:20px;\n    white-space:pre-wrap;\n    word-break:break-word;\n    font:14px/1.8 monospace;\n    color:#464940\n}\n\n\n/* =========================\n   手机端\n   ========================= */\n\n@media(max-width:650px){\n\n    .grid{\n        grid-template-columns:1fr\n    }\n\n    .section{\n        margin-left:8px;\n        margin-right:8px\n    }\n\n    .bar{\n        bottom:10px\n    }\n\n    .bar button{\n        padding:10px 13px\n    }\n\n    .preview_content{\n        padding:16px;\n        font-size:13px\n    }\n\n    .main_entry_header{\n        flex-wrap:wrap\n    }\n\n    .main_entry_name{\n        flex-basis:100%\n    }\n\n    .main_entry_move,\n    .main_entry_delete{\n        margin-top:4px\n    }\n}\n</style>\n</head>\n\n<body>\n\n<div class=\"app\">\n\n<header>\n    <h1>角色卡编辑器</h1>\n    <p>填写角色信息 · 条目可添加 / 删除 · 一键生成</p>\n</header>\n\n<main>\n\n<section class=\"section\">\n<div class=\"title\">基本信息</div>\n<div class=\"body grid\">\n\n<div class=\"field\">\n<label>角色名</label>\n<input id=\"char_name\">\n</div>\n\n<div class=\"field\">\n<label>中文名</label>\n<input id=\"chinese_name\">\n</div>\n\n<div class=\"field\">\n<label>Nickname</label>\n<input id=\"nickname\">\n</div>\n\n<div class=\"field\">\n<label>年龄</label>\n<input id=\"age\">\n</div>\n\n<div class=\"field\">\n<label>性别</label>\n<input id=\"gender\">\n</div>\n\n<div class=\"field\">\n<label>身高</label>\n<input id=\"height\">\n</div>\n\n<div class=\"field\" style=\"grid-column:1/-1\">\n<label>Archetype</label>\n<input id=\"archetype\">\n<p class=\"field_hint\">代表原型，通常在这里使用便于 AI 理解的概括性文学形象，比如花花公子、傲娇、魅力型操控者，作为个性代表或补充，和 tag 的效果近似。</p>\n</div>\n\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">身份</div>\n<div class=\"body\">\n<div id=\"identity\"></div>\n<button class=\"add\" onclick=\"addList('identity')\">＋ 添加</button>\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">背景经历</div>\n<div class=\"body\">\n\n<div class=\"field\">\n<label>童年（0-12岁）</label>\n<textarea id=\"childhood\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>少年（13-18岁）</label>\n<textarea id=\"teen\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>青年（19-35岁）</label>\n<textarea id=\"young\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>中年（35-至今）</label>\n<textarea id=\"middle\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>现状</label>\n<textarea id=\"current\"></textarea>\n</div>\n\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">社会关系</div>\n<div class=\"body\">\n<div id=\"social_status\"></div>\n<button class=\"add\" onclick=\"addList('social_status')\">＋ 添加</button>\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">外貌</div>\n<div class=\"body grid\">\n\n<div class=\"field\">\n<label>Hair</label>\n<input id=\"hair\">\n</div>\n\n<div class=\"field\">\n<label>Eyes</label>\n<input id=\"eyes\">\n</div>\n\n<div class=\"field\">\n<label>Skin</label>\n<input id=\"skin\">\n</div>\n\n<div class=\"field\">\n<label>Face Style</label>\n<input id=\"face_style\">\n</div>\n\n<div class=\"field\" style=\"grid-column:1/-1\">\n<label>Build</label>\n<div id=\"build\"></div>\n<button class=\"add\" onclick=\"addList('build')\">＋ 添加</button>\n</div>\n\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">穿着</div>\n<div class=\"body\">\n\n<div class=\"field\">\n<label>Business Formal</label>\n<textarea id=\"business_formal\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>Business Casual</label>\n<textarea id=\"business_casual\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>Casual Wear</label>\n<textarea id=\"casual_wear\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>Home Wear</label>\n<textarea id=\"home_wear\"></textarea>\n</div>\n\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">性格</div>\n<div class=\"body\">\n\n<div class=\"sub\">核心特质</div>\n<div id=\"core_traits\"></div>\n<button class=\"add\" onclick=\"addPair('core_traits')\">＋ 添加</button>\n\n<div class=\"sub\">恋爱特质</div>\n<div id=\"romantic_traits\"></div>\n<button class=\"add\" onclick=\"addPair('romantic_traits')\">＋ 添加</button>\n\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">行为与偏好</div>\n<div class=\"body\">\n\n<div class=\"sub\">生活行为</div>\n<div id=\"lifestyle\"></div>\n<button class=\"add\" onclick=\"addList('lifestyle')\">＋ 添加</button>\n\n<div class=\"sub\">工作行为</div>\n<div id=\"work\"></div>\n<button class=\"add\" onclick=\"addList('work')\">＋ 添加</button>\n\n<div class=\"sub\">情绪行为</div>\n\n<div class=\"field\">\n<label>Angry</label>\n<textarea id=\"angry\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>Happy</label>\n<textarea id=\"happy\"></textarea>\n</div>\n\n<div class=\"sub\">目标</div>\n<div id=\"goals\"></div>\n<button class=\"add\" onclick=\"addList('goals')\">＋ 添加</button>\n\n<div class=\"sub\">弱点</div>\n<div id=\"weakness\"></div>\n<button class=\"add\" onclick=\"addList('weakness')\">＋ 添加</button>\n\n<div class=\"sub\">喜欢</div>\n<div id=\"likes\"></div>\n<button class=\"add\" onclick=\"addList('likes')\">＋ 添加</button>\n\n<div class=\"sub\">不喜欢</div>\n<div id=\"dislikes\"></div>\n<button class=\"add\" onclick=\"addList('dislikes')\">＋ 添加</button>\n\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">技能</div>\n<div class=\"body\">\n\n<div class=\"sub\">工作</div>\n<div id=\"skill_work\"></div>\n<button class=\"add\" onclick=\"addList('skill_work')\">＋ 添加</button>\n\n<div class=\"sub\">生活</div>\n<div id=\"skill_life\"></div>\n<button class=\"add\" onclick=\"addList('skill_life')\">＋ 添加</button>\n\n<div class=\"sub\">爱好</div>\n<div id=\"skill_hobby\"></div>\n<button class=\"add\" onclick=\"addList('skill_hobby')\">＋ 添加</button>\n\n</div>\n</section>\n\n\n<section class=\"section\">\n<div class=\"title\">NSFW Information</div>\n<div class=\"body\">\n\n<div class=\"field\">\n<label>Experiences</label>\n<textarea id=\"experiences\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>Sexual Orientation</label>\n<input id=\"orientation\">\n</div>\n\n<div class=\"field\">\n<label>Sexual Role</label>\n<input id=\"role\">\n</div>\n\n<div class=\"field\">\n<label>Sexual Habits</label>\n<div id=\"habits\"></div>\n<button class=\"add\" onclick=\"addList('habits')\">＋ 添加</button>\n</div>\n\n<div class=\"field\">\n<label>Kinks</label>\n<textarea id=\"kinks\"></textarea>\n</div>\n\n<div class=\"field\">\n<label>Limits</label>\n<textarea id=\"limits\"></textarea>\n</div>\n\n</div>\n</section>\n\n\n<!-- =========================\n     自定义大条目\n     ========================= -->\n\n<section class=\"section\">\n<div class=\"title\">自定义条目</div>\n\n<div class=\"body\">\n\n<div id=\"custom_entries\"></div>\n\n<button\n    class=\"add_main_entry\"\n    onclick=\"addMainEntry()\"\n>\n    ＋ 增加条目\n</button>\n\n</div>\n</section>\n\n\n</main>\n</div>\n\n\n<div class=\"bar\">\n<button onclick=\"preview()\">预览</button>\n<button class=\"primary\" onclick=\"copyOut()\">生成并复制</button>\n</div>\n\n\n<script>\n\n/* =========================================================\n   固定列表\n   ========================================================= */\n\nfunction addList(id){\n\n    const b =\n        document.getElementById(id);\n\n    const r =\n        document.createElement('div');\n\n    r.className =\n        'row';\n\n    r.innerHTML =\n        '<input placeholder=\"填写内容\">' +\n        '<button class=\"del\" onclick=\"this.parentElement.remove();saveData()\">×</button>';\n\n    b.appendChild(r);\n\n    saveData();\n}\n\n\nfunction addPair(id){\n\n    const b =\n        document.getElementById(id);\n\n    const r =\n        document.createElement('div');\n\n    r.className =\n        'row';\n\n    r.innerHTML =\n        '<input placeholder=\"特质\">' +\n        '<input placeholder=\"描述\">' +\n        '<button class=\"del\" onclick=\"this.parentElement.remove();saveData()\">×</button>';\n\n    b.appendChild(r);\n\n    saveData();\n}\n\n\n/* =========================================================\n   自定义大条目\n   ========================================================= */\n\nfunction addMainEntry(\n    savedName = '',\n    savedItems = []\n){\n\n    const container =\n        document.getElementById(\n            'custom_entries'\n        );\n\n    const entry =\n        document.createElement('div');\n\n    entry.className =\n        'main_entry';\n\n    entry.innerHTML = `\n\n        <div class=\"main_entry_header\">\n\n            <input\n                class=\"main_entry_name\"\n                placeholder=\"大条目名称，例如 character\"\n                value=\"\"\n            >\n\n            <button\n                class=\"main_entry_move\"\n                type=\"button\"\n                title=\"上移\"\n            >\n                ↑\n            </button>\n\n            <button\n                class=\"main_entry_move\"\n                type=\"button\"\n                title=\"下移\"\n            >\n                ↓\n            </button>\n\n            <button\n                class=\"main_entry_delete\"\n                type=\"button\"\n            >\n                删除\n            </button>\n\n        </div>\n\n        <div class=\"main_entry_list\"></div>\n\n        <button\n            class=\"add\"\n            type=\"button\"\n        >\n            ＋ 添加\n        </button>\n    `;\n\n\n    const nameInput =\n        entry.querySelector(\n            '.main_entry_name'\n        );\n\n\n    const moveButtons =\n        entry.querySelectorAll(\n            '.main_entry_move'\n        );\n\n\n    const deleteButton =\n        entry.querySelector(\n            '.main_entry_delete'\n        );\n\n\n    const listBox =\n        entry.querySelector(\n            '.main_entry_list'\n        );\n\n\n    const addButton =\n        entry.querySelector(\n            '.add'\n        );\n\n\n    nameInput.value =\n        savedName || '';\n\n\n    /* 上移 */\n\n    moveButtons[0].onclick =\n        function(){\n\n            const previous =\n                entry.previousElementSibling;\n\n            if(previous){\n\n                container.insertBefore(\n                    entry,\n                    previous\n                );\n\n                saveData();\n\n            }\n\n        };\n\n\n    /* 下移 */\n\n    moveButtons[1].onclick =\n        function(){\n\n            const next =\n                entry.nextElementSibling;\n\n            if(next){\n\n                container.insertBefore(\n                    next,\n                    entry\n                );\n\n                saveData();\n\n            }\n\n        };\n\n\n    /* 删除 */\n\n    deleteButton.onclick =\n        function(){\n\n            entry.remove();\n\n            saveData();\n\n        };\n\n\n    /* 添加子条目 */\n\n    addButton.onclick =\n        function(){\n\n            addMainItem(\n                listBox\n            );\n\n            saveData();\n\n        };\n\n\n    container.appendChild(\n        entry\n    );\n\n\n    /* 恢复已有内容 */\n\n    if(\n        Array.isArray(savedItems) &&\n        savedItems.length\n    ){\n\n        savedItems.forEach(\n            item => {\n\n                addMainItem(\n                    listBox,\n                    item\n                );\n\n            }\n        );\n\n    }else{\n\n        addMainItem(\n            listBox\n        );\n\n    }\n\n\n    nameInput.addEventListener(\n        'input',\n        saveData\n    );\n\n\n    saveData();\n\n}\n\n\nfunction addMainItem(\n    container,\n    value = ''\n){\n\n    const row =\n        document.createElement(\n            'div'\n        );\n\n    row.className =\n        'row';\n\n    row.innerHTML =\n        '<input placeholder=\"填写内容\">' +\n        '<button class=\"del\" type=\"button\">×</button>';\n\n\n    const input =\n        row.querySelector(\n            'input'\n        );\n\n\n    const deleteButton =\n        row.querySelector(\n            '.del'\n        );\n\n\n    input.value =\n        value || '';\n\n\n    deleteButton.onclick =\n        function(){\n\n            row.remove();\n\n            saveData();\n\n        };\n\n\n    container.appendChild(\n        row\n    );\n\n\n    input.addEventListener(\n        'input',\n        saveData\n    );\n\n}\n\n\n/* =========================================================\n   初始化固定项目\n   ========================================================= */\n\n[\n    'identity',\n    'social_status',\n    'build',\n    'lifestyle',\n    'work',\n    'goals',\n    'weakness',\n    'likes',\n    'dislikes',\n    'skill_work',\n    'skill_life',\n    'skill_hobby',\n    'habits'\n].forEach(\n    id => addList(id)\n);\n\n\n[\n    'core_traits',\n    'romantic_traits'\n].forEach(\n    id => addPair(id)\n);\n\n\n/* =========================================================\n   数据读取\n   ========================================================= */\n\nconst v =\n    id =>\n        document\n            .getElementById(id)\n            .value\n            .trim();\n\n\nconst ls =\n    id =>\n        [\n            ...document.querySelectorAll(\n                '#' + id + ' input'\n            )\n        ]\n        .map(\n            x => x.value.trim()\n        )\n        .filter(Boolean);\n\n\nconst ps =\n    id =>\n        [\n            ...document.querySelectorAll(\n                '#' + id + ' .row'\n            )\n        ]\n        .map(\n            r =>\n                [\n                    ...r.querySelectorAll(\n                        'input'\n                    )\n                ]\n                .map(\n                    x => x.value.trim()\n                )\n        )\n        .filter(\n            x => x[0] || x[1]\n        );\n\n\n/* =========================================================\n   YAML 字符串\n   ========================================================= */\n\nfunction q(s){\n\n    return '\"' +\n        String(s)\n            .replaceAll(\n                '\\\\',\n                '\\\\\\\\'\n            )\n            .replaceAll(\n                '\"',\n                '\\\\\"'\n            ) +\n        '\"';\n\n}\n\n\nfunction list(\n    n,\n    id,\n    ind = ''\n){\n\n    const a =\n        ls(id);\n\n    return a.length\n        ? n + ':\\n' +\n          a\n            .map(\n                x =>\n                    ind +\n                    '  - ' +\n                    x\n            )\n            .join('\\n')\n        : n + ':';\n\n}\n\n\nfunction pair(\n    n,\n    id,\n    ind = ''\n){\n\n    const a =\n        ps(id);\n\n    return a.length\n        ? n + ':\\n' +\n          a\n            .map(\n                x =>\n                    ind +\n                    '  - ' +\n                    x[0] +\n                    ': ' +\n                    q(\n                        x[1] || ''\n                    )\n            )\n            .join('\\n')\n        : n + ':';\n\n}\n\n\n/* =========================================================\n   自定义大条目\n   ========================================================= */\n\nfunction customEntries(){\n\n    const entries =\n        [\n            ...document.querySelectorAll(\n                '#custom_entries .main_entry'\n            )\n        ];\n\n\n    return entries\n        .map(\n            entry => {\n\n                const name =\n                    entry\n                        .querySelector(\n                            '.main_entry_name'\n                        )\n                        .value\n                        .trim();\n\n\n                const items =\n                    [\n                        ...entry.querySelectorAll(\n                            '.main_entry_list input'\n                        )\n                    ]\n                    .map(\n                        input =>\n                            input.value.trim()\n                    )\n                    .filter(\n                        Boolean\n                    );\n\n\n                return {\n                    name,\n                    items\n                };\n\n            }\n        )\n        .filter(\n            entry =>\n                entry.name ||\n                entry.items.length\n        );\n\n}\n\n\nfunction customEntriesYAML(){\n\n    const entries =\n        customEntries();\n\n\n    if(\n        !entries.length\n    ){\n\n        return '';\n\n    }\n\n\n    return entries\n        .map(\n            entry => {\n\n                if(\n                    entry.items.length\n                ){\n\n                    return (\n                        entry.name +\n                        ':\\n' +\n                        entry.items\n                            .map(\n                                item =>\n                                    '  - ' +\n                                    item\n                            )\n                            .join('\\n')\n                    );\n\n                }\n\n                return (\n                    entry.name +\n                    ':'\n                );\n\n            }\n        )\n        .join('\\n\\n');\n\n}\n\n\n/* =========================================================\n   生成角色卡\n   ========================================================= */\n\nfunction gen(){\n\n    const custom =\n        customEntriesYAML();\n\n\n    return `char_name: ${v('char_name')}\nChinese name: ${v('chinese_name')}\nNickname: ${v('nickname')}\nage: ${v('age')}\ngender: ${v('gender')}\nheight: ${v('height')}\n${list('identity','identity')}\n\nbackground_story:\n  童年(0-12岁): ${v('childhood')}\n  少年(13-18岁): ${v('teen')}\n  青年(19-35岁): ${v('young')}\n  中年(35-至今): ${v('middle')}\n  现状: ${v('current')}\n\n${list('social_status','social_status')}\n\nappearance:\n  hair: ${v('hair')}\n  eyes: ${v('eyes')}\n  skin: ${v('skin')}\n  face_style: ${v('face_style')}\n${list('build','build','  ')}\n\nattire:\n  business_formal: ${v('business_formal')}\n  business_casual: ${v('business_casual')}\n  casual_wear: ${v('casual_wear')}\n  home_wear: ${v('home_wear')}\n\narchetype: ${v('archetype')}\n\npersonality:\n${pair('  core_traits','core_traits')}\n${pair('  romantic_traits','romantic_traits')}\n\n${list('lifestyle_behaviors','lifestyle')}\n${list('work_behaviors','work')}\n\nemotional_behaviors:\n  angry: ${v('angry')}\n  happy: ${v('happy')}\n\n${list('goals','goals')}\n${list('weakness','weakness')}\n${list('likes','likes')}\n${list('dislikes','dislikes')}\n\nskills:\n  - 工作: [${ls('skill_work').map(q).join(', ')}]\n  - 生活: [${ls('skill_life').map(q).join(', ')}]\n  - 爱好: [${ls('skill_hobby').map(q).join(', ')}]\n\nNSFW_information:\n  Sex_related traits:\n    experiences: ${v('experiences')}\n    sexual_orientation: ${v('orientation')}\n    sexual_role: ${v('role')}\n${list('    sexual_habits','habits')}\n  Kinks: ${v('kinks')}\n  Limits: ${v('limits')}${custom ? '\\n\\n' + custom : ''}`;\n\n}\n\n\n/* =========================================================\n   自动保存\n   ========================================================= */\n\nconst SAVE_KEY =\n    'character_card_editor_data_v1';\n\n\nfunction saveData(){\n\n    const data = {};\n\n\n    document\n        .querySelectorAll(\n            'input, textarea'\n        )\n        .forEach(\n            el => {\n\n                if(el.id){\n\n                    data[el.id] =\n                        el.value;\n\n                }\n\n            }\n        );\n\n\n    [\n        'identity',\n        'social_status',\n        'build',\n        'lifestyle',\n        'work',\n        'goals',\n        'weakness',\n        'likes',\n        'dislikes',\n        'skill_work',\n        'skill_life',\n        'skill_hobby',\n        'habits'\n    ].forEach(\n        id => {\n\n            data[id] =\n                [\n                    ...document.querySelectorAll(\n                        '#' + id + ' input'\n                    )\n                ]\n                .map(\n                    input =>\n                        input.value\n                );\n\n        }\n    );\n\n\n    [\n        'core_traits',\n        'romantic_traits'\n    ].forEach(\n        id => {\n\n            data[id] =\n                [\n                    ...document.querySelectorAll(\n                        '#' + id + ' .row'\n                    )\n                ]\n                .map(\n                    row =>\n                        [\n                            ...row.querySelectorAll(\n                                'input'\n                            )\n                        ]\n                        .map(\n                            input =>\n                                input.value\n                        )\n                );\n\n        }\n    );\n\n\n    data.custom_entries =\n        customEntries();\n\n\n    try{\n\n        localStorage.setItem(\n            SAVE_KEY,\n            JSON.stringify(\n                data\n            )\n        );\n\n    }catch(e){\n\n        console.error(\n            '角色卡数据保存失败:',\n            e\n        );\n\n    }\n\n}\n\n\n/* =========================================================\n   恢复数据\n   ========================================================= */\n\nfunction loadData(){\n\n    const raw =\n        localStorage.getItem(\n            SAVE_KEY\n        );\n\n\n    if(!raw){\n\n        return;\n\n    }\n\n\n    try{\n\n        const data =\n            JSON.parse(\n                raw\n            );\n\n\n        document\n            .querySelectorAll(\n                'input, textarea'\n            )\n            .forEach(\n                el => {\n\n                    if(\n                        el.id &&\n                        Object.prototype.hasOwnProperty.call(\n                            data,\n                            el.id\n                        ) &&\n                        typeof data[el.id] ===\n                            'string'\n                    ){\n\n                        el.value =\n                            data[el.id];\n\n                    }\n\n                }\n            );\n\n\n        [\n            'identity',\n            'social_status',\n            'build',\n            'lifestyle',\n            'work',\n            'goals',\n            'weakness',\n            'likes',\n            'dislikes',\n            'skill_work',\n            'skill_life',\n            'skill_hobby',\n            'habits'\n        ].forEach(\n            id => {\n\n                if(\n                    !Array.isArray(\n                        data[id]\n                    )\n                ){\n\n                    return;\n\n                }\n\n\n                const box =\n                    document.getElementById(\n                        id\n                    );\n\n\n                box.innerHTML =\n                    '';\n\n\n                data[id].forEach(\n                    value => {\n\n                        addList(id);\n\n\n                        const inputs =\n                            box.querySelectorAll(\n                                'input'\n                            );\n\n\n                        inputs[\n                            inputs.length - 1\n                        ].value =\n                            value;\n\n                    }\n                );\n\n            }\n        );\n\n\n        [\n            'core_traits',\n            'romantic_traits'\n        ].forEach(\n            id => {\n\n                if(\n                    !Array.isArray(\n                        data[id]\n                    )\n                ){\n\n                    return;\n\n                }\n\n\n                const box =\n                    document.getElementById(\n                        id\n                    );\n\n\n                box.innerHTML =\n                    '';\n\n\n                data[id].forEach(\n                    pair => {\n\n                        addPair(id);\n\n\n                        const rows =\n                            box.querySelectorAll(\n                                '.row'\n                            );\n\n\n                        const row =\n                            rows[\n                                rows.length - 1\n                            ];\n\n\n                        const inputs =\n                            row.querySelectorAll(\n                                'input'\n                            );\n\n\n                        inputs[0].value =\n                            pair[0] || '';\n\n\n                        inputs[1].value =\n                            pair[1] || '';\n\n                    }\n                );\n\n            }\n        );\n\n\n        const customContainer =\n            document.getElementById(\n                'custom_entries'\n            );\n\n\n        customContainer.innerHTML =\n            '';\n\n\n        if(\n            Array.isArray(\n                data.custom_entries\n            )\n        ){\n\n            data.custom_entries.forEach(\n                entry => {\n\n                    addMainEntry(\n                        entry.name || '',\n                        Array.isArray(\n                            entry.items\n                        )\n                            ? entry.items\n                            : []\n                    );\n\n                }\n            );\n\n        }\n\n    }catch(e){\n\n        console.error(\n            '角色卡数据恢复失败:',\n            e\n        );\n\n    }\n\n}\n\n\n/* =========================================================\n   自动保存\n   ========================================================= */\n\ndocument.addEventListener(\n    'input',\n    saveData\n);\n\n\ndocument.addEventListener(\n    'change',\n    saveData\n);\n\n\ndocument.addEventListener(\n    'visibilitychange',\n    function(){\n\n        if(\n            document.visibilityState ===\n                'hidden'\n        ){\n\n            saveData();\n\n        }\n\n    }\n);\n\n\nwindow.addEventListener(\n    'pagehide',\n    saveData\n);\n\n\nwindow.addEventListener(\n    'beforeunload',\n    saveData\n);\n\n\n/* =========================================================\n   预览\n   ========================================================= */\n\nfunction preview(){\n\n    const old =\n        document.getElementById(\n            'preview_overlay'\n        );\n\n\n    if(old){\n\n        old.remove();\n\n    }\n\n\n    saveData();\n\n\n    const overlay =\n        document.createElement(\n            'div'\n        );\n\n\n    overlay.id =\n        'preview_overlay';\n\n\n    overlay.innerHTML = `\n        <div class=\"preview_box\">\n\n            <div class=\"preview_header\">\n\n                <span>角色卡预览</span>\n\n                <button\n                    class=\"preview_close\"\n                    onclick=\"closePreview()\"\n                    aria-label=\"关闭预览\"\n                >\n                    ×\n                </button>\n\n            </div>\n\n            <pre\n                class=\"preview_content\"\n            ></pre>\n\n        </div>\n    `;\n\n\n    document.body.appendChild(\n        overlay\n    );\n\n\n    overlay\n        .querySelector(\n            '.preview_content'\n        )\n        .textContent =\n            gen();\n\n}\n\n\n/* =========================================================\n   关闭预览\n   ========================================================= */\n\nfunction closePreview(){\n\n    const overlay =\n        document.getElementById(\n            'preview_overlay'\n        );\n\n\n    if(overlay){\n\n        overlay.remove();\n\n    }\n\n}\n\n\n/* =========================================================\n   生成并复制\n   ========================================================= */\n\nfunction copyOut(){\n\n    saveData();\n\n    Android.copyText(\n        gen()\n    );\n\n}\n\n\n/* =========================================================\n   启动恢复\n   ========================================================= */\n\nloadData();\n\n<\/script>\n\n</body>\n</html>\n"
const IMPORT_HTML="<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>角色卡导入</title>\n\n<style>\n*{box-sizing:border-box}\nbody{\n    margin:0;\n    background:#eeeee8;\n    color:#464940;\n    font-family:system-ui,\"Microsoft YaHei\",sans-serif;\n}\n.app{\n    width:min(980px,100%);\n    margin:auto;\n    padding:18px 12px 36px;\n}\nheader{padding:4px 4px 16px}\nh1{margin:0;font-size:22px}\nheader p{margin:6px 0 0;color:#85897d;font-size:13px}\n\n.import_card{\n    background:#f8f8f3;\n    border:1px solid #d9dad0;\n    border-radius:14px;\n    padding:14px;\n}\n.import_row{\n    display:flex;\n    align-items:center;\n    gap:10px;\n    flex-wrap:wrap;\n}\n.import_btn{\n    display:inline-flex;\n    align-items:center;\n    gap:7px;\n    height:40px;\n    padding:0 14px;\n    border-radius:9px;\n    background:#9aa58c;\n    color:#fff;\n    cursor:pointer;\n    font-size:14px;\n    user-select:none;\n}\n.import_btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n.file_input{display:none}\n.clear_btn{\n    height:40px;\n    padding:0 13px;\n    border:0;\n    border-radius:9px;\n    background:#e9e9e1;\n    color:#555;\n    font:inherit;\n    cursor:pointer;\n}\n.status{margin-top:10px;font-size:12px;color:#85897d;line-height:1.6}\n\n.info_card{\n    margin-top:12px;\n    display:grid;\n    grid-template-columns:1.4fr .8fr .9fr;\n    gap:8px;\n}\n.info_item{\n    background:#fffef9;\n    border:1px solid #d9dad0;\n    border-radius:11px;\n    padding:10px 12px;\n}\n.info_label{font-size:11px;color:#9a9f95}\n.info_value{margin-top:3px;font-size:13px;word-break:break-word}\n\n.section{\n    margin-top:12px;\n    background:#f8f8f3;\n    border:1px solid #d9dad0;\n    border-radius:14px;\n    overflow:hidden;\n}\n.section_head{\n    list-style:none;\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    gap:12px;\n    padding:12px 14px;\n    font-weight:600;\n    font-size:14px;\n    cursor:pointer;\n    user-select:none;\n}\n.section_head::-webkit-details-marker{display:none}\n.section_arrow{\n    flex:none;\n    color:#85897d;\n    font-size:16px;\n    line-height:1;\n    transition:transform .15s ease;\n}\n.section[open] > .section_head{\n    border-bottom:1px solid #d9dad0;\n}\n.section[open] .section_arrow{\n    transform:rotate(180deg);\n}\n.section_body{padding:12px 14px 14px}\n\n.field{\n    padding:10px 0;\n    border-bottom:1px solid #e4e5de;\n}\n.field:last-child{border-bottom:0}\n.field_name{font-size:12px;color:#73786d;margin-bottom:5px}\n.field_value{\n    white-space:pre-wrap;\n    word-break:break-word;\n    line-height:1.75;\n    font-size:14px;\n}\n.empty{color:#aaa;font-style:italic}\n\n.chip_wrap{display:flex;flex-wrap:wrap;gap:6px}\n.chip{\n    display:inline-block;\n    padding:4px 9px;\n    border-radius:999px;\n    background:#ecefe7;\n    color:#596047;\n    font-size:12px;\n}\n\n.greeting{\n    padding:11px 12px;\n    margin-bottom:8px;\n    border:1px solid #dfe1d8;\n    border-radius:10px;\n    background:#fffef9;\n}\n.greeting:last-child{margin-bottom:0}\n.greeting_title{font-size:12px;color:#73786d;margin-bottom:5px}\n.greeting_text{white-space:pre-wrap;word-break:break-word;line-height:1.75;font-size:14px}\n\n.lore_meta{\n    display:grid;\n    grid-template-columns:repeat(4,minmax(0,1fr));\n    gap:7px;\n    margin-bottom:10px;\n}\n.lore_meta_item{\n    padding:8px 9px;\n    border-radius:9px;\n    background:#fffef9;\n    border:1px solid #dfe1d8;\n}\n.lore_meta_label{font-size:10px;color:#9a9f95}\n.lore_meta_value{margin-top:2px;font-size:12px}\n\n.entry{\n    padding:12px;\n    margin-top:8px;\n    border:1px solid #dfe1d8;\n    border-radius:10px;\n    background:#fffef9;\n}\n.entry:first-child{margin-top:0}\n.entry_title{font-weight:600;font-size:13px;color:#596047}\n.entry_row{margin-top:7px}\n.entry_label{font-size:11px;color:#9a9f95;margin-bottom:3px}\n.entry_text{white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:13px}\n\n.extension_block{\n    margin-top:8px;\n    padding:10px 11px;\n    border-radius:10px;\n    background:#fffef9;\n    border:1px solid #dfe1d8;\n}\n.extension_block:first-child{margin-top:0}\n.extension_key{font-size:12px;font-weight:600;color:#596047}\n.extension_value{margin-top:5px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7}\n\n.asset{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    gap:10px;\n    padding:9px 10px;\n    margin-top:7px;\n    border:1px solid #dfe1d8;\n    border-radius:9px;\n    background:#fffef9;\n}\n.asset:first-child{margin-top:0}\n.asset_name{font-size:13px;color:#596047;word-break:break-word}\n.asset_info{font-size:11px;color:#9a9f95;word-break:break-word;text-align:right}\n\n.raw_details summary{\n    cursor:pointer;\n    color:#596047;\n    font-size:13px;\n}\n.raw_json{\n    margin:10px 0 0;\n    padding:12px;\n    border-radius:10px;\n    background:#fffef9;\n    border:1px solid #dfe1d8;\n    white-space:pre-wrap;\n    word-break:break-word;\n    font:12px/1.7 Consolas,\"SFMono-Regular\",monospace;\n    overflow:auto;\n}\n\n.hidden{display:none!important}\n\n@media(max-width:720px){\n    .info_card{grid-template-columns:1fr}\n    .lore_meta{grid-template-columns:1fr 1fr}\n}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n\n<header>\n    <h1>角色卡导入</h1>\n    <p>导入 JSON / PNG，按角色卡实际结构解析，不强制套用固定模板。</p>\n</header>\n\n<section class=\"import_card\">\n    <div class=\"import_row\">\n        <label class=\"import_btn\" for=\"fileInput\">\n            <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n                <path d=\"M12 3v11\"></path>\n                <path d=\"M8 10l4 4 4-4\"></path>\n                <path d=\"M5 17v1.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V17\"></path>\n            </svg>\n            <span>导入角色卡</span>\n        </label>\n        <button class=\"clear_btn\" id=\"clearBtn\" type=\"button\">清空</button>\n        <input class=\"file_input\" id=\"fileInput\" type=\"file\" accept=\".json,.png,application/json,image/png\">\n    </div>\n    <div class=\"status\" id=\"status\">尚未导入角色卡。</div>\n</section>\n\n<section class=\"info_card hidden\" id=\"infoCard\">\n    <div class=\"info_item\"><div class=\"info_label\">文件</div><div class=\"info_value\" id=\"fileName\">-</div></div>\n    <div class=\"info_item\"><div class=\"info_label\">格式</div><div class=\"info_value\" id=\"fileType\">-</div></div>\n    <div class=\"info_item\"><div class=\"info_label\">规格</div><div class=\"info_value\" id=\"cardSpec\">-</div></div>\n</section>\n\n<details class=\"section hidden\" id=\"characterSection\">\n    <summary class=\"section_head\">\n        <span>角色内容</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\" id=\"characterBody\"></div>\n</details>\n\n<details class=\"section hidden\" id=\"greetingSection\">\n    <summary class=\"section_head\">\n        <span>开场白</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\" id=\"greetingBody\"></div>\n</details>\n\n<details class=\"section hidden\" id=\"promptSection\">\n    <summary class=\"section_head\">\n        <span>提示词与创作者信息</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\" id=\"promptBody\"></div>\n</details>\n\n<details class=\"section hidden\" id=\"loreSection\">\n    <summary class=\"section_head\">\n        <span>世界书 / 角色书</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\" id=\"loreBody\"></div>\n</details>\n\n<details class=\"section hidden\" id=\"assetSection\">\n    <summary class=\"section_head\">\n        <span>角色卡资源</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\" id=\"assetBody\"></div>\n</details>\n\n<details class=\"section hidden\" id=\"statusSection\">\n    <summary class=\"section_head\">\n        <span>状态与扩展</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\" id=\"statusBody\"></div>\n</details>\n\n<details class=\"section hidden\" id=\"extraSection\">\n    <summary class=\"section_head\">\n        <span>其他字段</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\" id=\"extraBody\"></div>\n</details>\n\n<details class=\"section hidden\" id=\"rawSection\">\n    <summary class=\"section_head\">\n        <span>原始 JSON</span>\n        <span class=\"section_arrow\" aria-hidden=\"true\">⌄</span>\n    </summary>\n    <div class=\"section_body\">\n        <pre class=\"raw_json\" id=\"rawJson\"></pre>\n    </div>\n</details>\n\n</div>\n\n<script>\nconst fileInput=document.getElementById('fileInput');\nconst clearBtn=document.getElementById('clearBtn');\nconst statusEl=document.getElementById('status');\n\nlet objectUrl=null;\n\nconst sections={\n    info:document.getElementById('infoCard'),\n    character:document.getElementById('characterSection'),\n    greeting:document.getElementById('greetingSection'),\n    prompt:document.getElementById('promptSection'),\n    lore:document.getElementById('loreSection'),\n    asset:document.getElementById('assetSection'),\n    status:document.getElementById('statusSection'),\n    extra:document.getElementById('extraSection'),\n    raw:document.getElementById('rawSection')\n};\n\nfileInput.addEventListener('change',()=>{\n    const file=fileInput.files&&fileInput.files[0];\n    if(file) importCard(file);\n});\n\nclearBtn.addEventListener('click',()=>{\n    fileInput.value='';\n    resetAll();\n});\n\nfunction resetAll(){\n    if(objectUrl){\n        URL.revokeObjectURL(objectUrl);\n        objectUrl=null;\n    }\n    Object.values(sections).forEach(x=>x.classList.add('hidden'));\n    document.getElementById('characterBody').innerHTML='';\n    document.getElementById('greetingBody').innerHTML='';\n    document.getElementById('promptBody').innerHTML='';\n    document.getElementById('loreBody').innerHTML='';\n    document.getElementById('assetBody').innerHTML='';\n    document.getElementById('statusBody').innerHTML='';\n    document.getElementById('extraBody').innerHTML='';\n    document.getElementById('rawJson').textContent='';\n    statusEl.textContent='尚未导入角色卡。';\n}\n\nasync function importCard(file){\n    resetAll();\n    document.getElementById('fileName').textContent=file.name;\n    sections.info.classList.remove('hidden');\n\n    try{\n        if(isPng(file)){\n            document.getElementById('fileType').textContent='PNG';\n            const data=await readPNGCard(file);\n            renderCard(data,'PNG');\n            statusEl.textContent='PNG 角色卡解析成功。';\n        }else if(isJson(file)){\n            document.getElementById('fileType').textContent='JSON';\n            const text=await file.text();\n            const data=JSON.parse(text);\n            renderCard(data,'JSON');\n            statusEl.textContent='JSON 角色卡解析成功。';\n        }else{\n            throw new Error('目前支持 JSON / PNG。');\n        }\n    }catch(e){\n        console.error(e);\n        statusEl.textContent='导入失败：'+(e.message||e);\n    }\n}\n\nfunction isPng(file){return file.type==='image/png'||/\\.png$/i.test(file.name)}\nfunction isJson(file){return file.type==='application/json'||/\\.json$/i.test(file.name)}\n\nfunction unwrapCard(raw){\n    if(raw && raw.data && typeof raw.data==='object' && (\n        raw.spec==='chara_card_v2' ||\n        raw.spec==='chara_card_v3'\n    )){\n        return raw.data;\n    }\n    return raw;\n}\n\nfunction getSpec(raw){\n    if(raw&&raw.spec==='chara_card_v3') return 'Character Card V3';\n    if(raw&&raw.spec==='chara_card_v2') return 'Character Card V2';\n    if(raw&&raw.name!==undefined) return 'Character Card V1 / Legacy';\n    if(raw&&raw.data&&raw.data.name!==undefined) return 'Character Card';\n    return '未知 JSON 结构';\n}\n\nfunction renderCard(raw,fileType){\n    const data=unwrapCard(raw);\n    document.getElementById('cardSpec').textContent=getSpec(raw);\n\n    renderCharacter(data);\n    renderGreetings(data);\n    renderPrompts(data);\n    renderLore(data.character_book);\n    renderAssets(data.assets);\n    renderStatus(data,raw);\n    renderExtras(data);\n\n    document.getElementById('rawJson').textContent=JSON.stringify(raw,null,2);\n    sections.raw.classList.remove('hidden');\n}\n\nfunction renderCharacter(data){\n    const box=document.getElementById('characterBody');\n    box.innerHTML='';\n\n    const fields=[\n        ['name','角色名'],\n        ['nickname','昵称'],\n        ['description','角色描述'],\n        ['personality','性格'],\n        ['scenario','场景'],\n        ['mes_example','示例对话']\n    ];\n\n    let count=0;\n    fields.forEach(([key,label])=>{\n        if(has(data,key)){\n            box.appendChild(textField(label,data[key]));\n            count++;\n        }\n    });\n\n    if(Array.isArray(data.tags)){\n        box.appendChild(chipField('标签',data.tags));\n        count++;\n    }\n\n    if(data.creator!==undefined){\n        box.appendChild(textField('创建者',data.creator));\n        count++;\n    }\n\n    if(data.character_version!==undefined){\n        box.appendChild(textField('角色卡版本',data.character_version));\n        count++;\n    }\n\n    if(count) sections.character.classList.remove('hidden');\n}\n\nfunction renderGreetings(data){\n    const box=document.getElementById('greetingBody');\n    box.innerHTML='';\n    let count=0;\n\n    if(has(data,'first_mes')){\n        box.appendChild(greeting('默认开场白',data.first_mes));\n        count++;\n    }\n\n    if(Array.isArray(data.alternate_greetings)){\n        data.alternate_greetings.forEach((x,i)=>{\n            box.appendChild(greeting('备用开场白 '+(i+1),x));\n            count++;\n        });\n    }\n\n    if(Array.isArray(data.group_only_greetings)){\n        data.group_only_greetings.forEach((x,i)=>{\n            box.appendChild(greeting('群聊开场白 '+(i+1),x));\n            count++;\n        });\n    }\n\n    if(count) sections.greeting.classList.remove('hidden');\n}\n\nfunction renderPrompts(data){\n    const box=document.getElementById('promptBody');\n    box.innerHTML='';\n    let count=0;\n\n    const fields=[\n        ['system_prompt','系统提示词'],\n        ['post_history_instructions','历史消息后提示词'],\n        ['creator_notes','创建者备注']\n    ];\n\n    fields.forEach(([key,label])=>{\n        if(has(data,key)){\n            box.appendChild(textField(label,data[key]));\n            count++;\n        }\n    });\n\n    if(data.creator_notes_multilingual && typeof data.creator_notes_multilingual==='object'){\n        box.appendChild(objectField('多语言创建者备注',data.creator_notes_multilingual));\n        count++;\n    }\n\n    if(data.source!==undefined){\n        box.appendChild(arrayOrTextField('来源',data.source));\n        count++;\n    }\n\n    if(count) sections.prompt.classList.remove('hidden');\n}\n\nfunction renderLore(book){\n    const box=document.getElementById('loreBody');\n    box.innerHTML='';\n    if(!book || typeof book!=='object') return;\n\n    const meta=[\n        ['名称',book.name],\n        ['扫描深度',book.scan_depth],\n        ['Token预算',book.token_budget],\n        ['递归扫描',book.recursive_scanning]\n    ].filter(x=>x[1]!==undefined);\n\n    if(meta.length){\n        const grid=document.createElement('div');\n        grid.className='lore_meta';\n        meta.forEach(([label,value])=>{\n            const item=document.createElement('div');\n            item.className='lore_meta_item';\n            item.innerHTML='<div class=\"lore_meta_label\"></div><div class=\"lore_meta_value\"></div>';\n            item.children[0].textContent=label;\n            item.children[1].textContent=formatSimple(value);\n            grid.appendChild(item);\n        });\n        box.appendChild(grid);\n    }\n\n    if(book.description!==undefined){\n        box.appendChild(textField('世界书说明',book.description));\n    }\n\n    if(Array.isArray(book.entries)){\n        book.entries.forEach((entry,index)=>{\n            box.appendChild(renderLoreEntry(entry,index));\n        });\n    }\n\n    if(book.extensions!==undefined){\n        box.appendChild(extensionGroup('世界书扩展',book.extensions));\n    }\n\n    sections.lore.classList.remove('hidden');\n}\n\nfunction renderLoreEntry(entry,index){\n    const el=document.createElement('div');\n    el.className='entry';\n\n    const title=document.createElement('div');\n    title.className='entry_title';\n    title.textContent=entry.name || entry.comment || ('条目 '+(index+1));\n    el.appendChild(title);\n\n    if(Array.isArray(entry.keys)) el.appendChild(entryRow('关键词',entry.keys.join('、')));\n    if(Array.isArray(entry.secondary_keys)) el.appendChild(entryRow('次要关键词',entry.secondary_keys.join('、')));\n    if(entry.content!==undefined) el.appendChild(entryRow('内容',entry.content));\n    if(entry.enabled!==undefined) el.appendChild(entryRow('启用',entry.enabled));\n    if(entry.constant!==undefined) el.appendChild(entryRow('常驻',entry.constant));\n    if(entry.selective!==undefined) el.appendChild(entryRow('选择性',entry.selective));\n    if(entry.case_sensitive!==undefined) el.appendChild(entryRow('区分大小写',entry.case_sensitive));\n    if(entry.use_regex!==undefined) el.appendChild(entryRow('正则',entry.use_regex));\n    if(entry.insertion_order!==undefined) el.appendChild(entryRow('插入顺序',entry.insertion_order));\n    if(entry.priority!==undefined) el.appendChild(entryRow('优先级',entry.priority));\n    if(entry.position!==undefined) el.appendChild(entryRow('位置',entry.position));\n    if(entry.id!==undefined) el.appendChild(entryRow('ID',entry.id));\n    if(entry.extensions!==undefined) el.appendChild(extensionGroup('条目扩展',entry.extensions));\n\n    return el;\n}\n\nfunction renderAssets(assets){\n    const box=document.getElementById('assetBody');\n    box.innerHTML='';\n    if(!Array.isArray(assets)||!assets.length) return;\n\n    assets.forEach(asset=>{\n        const el=document.createElement('div');\n        el.className='asset';\n\n        const left=document.createElement('div');\n        left.className='asset_name';\n        left.textContent=asset.name || asset.uri || '未命名资源';\n\n        const right=document.createElement('div');\n        right.className='asset_info';\n        right.textContent=[asset.type,asset.ext,asset.uri].filter(Boolean).join(' · ');\n\n        el.appendChild(left);\n        el.appendChild(right);\n        box.appendChild(el);\n    });\n\n    sections.asset.classList.remove('hidden');\n}\n\nfunction renderStatus(data,raw){\n    const box=document.getElementById('statusBody');\n    box.innerHTML='';\n    let count=0;\n\n    if(data.extensions!==undefined){\n        box.appendChild(extensionGroup('角色扩展（extensions）',data.extensions));\n        count++;\n    }\n\n    const dates=[];\n    if(data.creation_date!==undefined) dates.push(['创建时间',formatDateValue(data.creation_date)]);\n    if(data.modification_date!==undefined) dates.push(['修改时间',formatDateValue(data.modification_date)]);\n\n    dates.forEach(([label,value])=>{\n        box.appendChild(textField(label,value));\n        count++;\n    });\n\n    if(raw&&raw.spec_version!==undefined){\n        box.appendChild(textField('Spec 版本',raw.spec_version));\n        count++;\n    }\n\n    if(count) sections.status.classList.remove('hidden');\n}\n\nfunction renderExtras(data){\n    const box=document.getElementById('extraBody');\n    box.innerHTML='';\n\n    const known=new Set([\n        'name','nickname','description','personality','scenario','first_mes','mes_example',\n        'creator_notes','creator_notes_multilingual','system_prompt','post_history_instructions',\n        'alternate_greetings','group_only_greetings','tags','creator','character_version',\n        'extensions','character_book','assets','source','creation_date','modification_date'\n    ]);\n\n    const keys=Object.keys(data).filter(key=>!known.has(key));\n\n    keys.forEach(key=>{\n        box.appendChild(dynamicField(key,data[key]));\n    });\n\n    if(keys.length) sections.extra.classList.remove('hidden');\n}\n\nfunction textField(label,value){\n    const el=document.createElement('div');\n    el.className='field';\n    el.innerHTML='<div class=\"field_name\"></div><div class=\"field_value\"></div>';\n    el.children[0].textContent=label;\n    el.children[1].textContent=formatSimple(value);\n    return el;\n}\n\nfunction arrayOrTextField(label,value){\n    if(Array.isArray(value)) return chipField(label,value);\n    return textField(label,value);\n}\n\nfunction chipField(label,items){\n    const el=document.createElement('div');\n    el.className='field';\n    const name=document.createElement('div');\n    name.className='field_name';\n    name.textContent=label;\n    el.appendChild(name);\n\n    const wrap=document.createElement('div');\n    wrap.className='chip_wrap';\n\n    items.forEach(item=>{\n        const chip=document.createElement('span');\n        chip.className='chip';\n        chip.textContent=formatSimple(item);\n        wrap.appendChild(chip);\n    });\n\n    el.appendChild(wrap);\n    return el;\n}\n\nfunction greeting(label,value){\n    const el=document.createElement('div');\n    el.className='greeting';\n    el.innerHTML='<div class=\"greeting_title\"></div><div class=\"greeting_text\"></div>';\n    el.children[0].textContent=label;\n    el.children[1].textContent=formatSimple(value);\n    return el;\n}\n\nfunction entryRow(label,value){\n    const el=document.createElement('div');\n    el.className='entry_row';\n    el.innerHTML='<div class=\"entry_label\"></div><div class=\"entry_text\"></div>';\n    el.children[0].textContent=label;\n    el.children[1].textContent=formatSimple(value);\n    return el;\n}\n\nfunction objectField(label,value){\n    const el=document.createElement('div');\n    el.className='field';\n    el.appendChild(textNode(label,'field_name'));\n\n    Object.keys(value).forEach(key=>{\n        el.appendChild(entryRow(key,value[key]));\n    });\n\n    return el;\n}\n\nfunction extensionGroup(label,value){\n    const wrap=document.createElement('div');\n    wrap.className='field';\n\n    const title=document.createElement('div');\n    title.className='field_name';\n    title.textContent=label;\n    wrap.appendChild(title);\n\n    if(value&&typeof value==='object'&&!Array.isArray(value)){\n        Object.keys(value).forEach(key=>{\n            const block=document.createElement('div');\n            block.className='extension_block';\n\n            const keyEl=document.createElement('div');\n            keyEl.className='extension_key';\n            keyEl.textContent=key;\n\n            const valueEl=document.createElement('div');\n            valueEl.className='extension_value';\n            valueEl.textContent=formatSimple(value[key]);\n\n            block.appendChild(keyEl);\n            block.appendChild(valueEl);\n            wrap.appendChild(block);\n        });\n    }else{\n        wrap.appendChild(textNode(formatSimple(value),'field_value'));\n    }\n\n    return wrap;\n}\n\nfunction dynamicField(key,value){\n    if(Array.isArray(value)){\n        return chipField(key,value);\n    }\n    if(value&&typeof value==='object'){\n        return extensionGroup(key,value);\n    }\n    return textField(key,value);\n}\n\nfunction textNode(text,className){\n    const el=document.createElement('div');\n    el.className=className;\n    el.textContent=text;\n    return el;\n}\n\nfunction has(obj,key){\n    return Object.prototype.hasOwnProperty.call(obj,key);\n}\n\nfunction formatSimple(value){\n    if(value===null) return 'null';\n    if(value===undefined) return '';\n    if(typeof value==='boolean') return value?'是':'否';\n    if(typeof value==='object') return JSON.stringify(value,null,2);\n    return String(value);\n}\n\nfunction formatDateValue(value){\n    if(typeof value!=='number') return String(value);\n    const date=new Date(value>100000000000?value:value*1000);\n    if(Number.isNaN(date.getTime())) return String(value);\n    return date.toLocaleString();\n}\n\n/* =========================\n   PNG 角色卡读取\n   ========================= */\n\nasync function readPNGCard(file){\n    const buffer=await file.arrayBuffer();\n    const chunks=parsePNGChunks(buffer);\n    const items=[];\n\n    for(const chunk of chunks){\n        if(chunk.type==='tEXt'){\n            const x=parseTEXT(chunk.data);\n            if(x) items.push(x);\n        }else if(chunk.type==='zTXt'){\n            const x=await parseZTXT(chunk.data);\n            if(x) items.push(x);\n        }else if(chunk.type==='iTXt'){\n            const x=await parseITXT(chunk.data);\n            if(x) items.push(x);\n        }\n    }\n\n    const ccv3=items.find(x=>x.keyword==='ccv3');\n    if(ccv3){\n        const parsed=await decodePayload(ccv3.text);\n        if(parsed) return parsed;\n    }\n\n    const chara=items.find(x=>x.keyword==='chara');\n    if(chara){\n        const parsed=await decodePayload(chara.text);\n        if(parsed) return parsed;\n    }\n\n    throw new Error('PNG 中没有找到可识别的角色卡 metadata。');\n}\n\nfunction parsePNGChunks(buffer){\n    const b=new Uint8Array(buffer);\n    const sig=[137,80,78,71,13,10,26,10];\n\n    for(let i=0;i<8;i++){\n        if(b[i]!==sig[i]) throw new Error('无效 PNG 文件。');\n    }\n\n    const chunks=[];\n    let p=8;\n\n    while(p+8<=b.length){\n        const len=readU32(b,p);\n        const type=String.fromCharCode(b[p+4],b[p+5],b[p+6],b[p+7]);\n        const start=p+8;\n        const end=start+len;\n        if(end+4>b.length) throw new Error('PNG 结构损坏。');\n        chunks.push({type,data:b.slice(start,end)});\n        p=end+4;\n        if(type==='IEND') break;\n    }\n    return chunks;\n}\n\nfunction readU32(b,p){\n    return ((b[p]*0x1000000)+(b[p+1]*0x10000)+(b[p+2]*0x100)+b[p+3])>>>0;\n}\n\nfunction parseTEXT(b){\n    const z=b.indexOf(0);\n    if(z<0) return null;\n    return {keyword:latin1(b.slice(0,z)),text:latin1(b.slice(z+1))};\n}\n\nasync function parseZTXT(b){\n    const z=b.indexOf(0);\n    if(z<0||z+2>b.length||b[z+1]!==0) return null;\n    try{\n        const out=await inflate(b.slice(z+2));\n        return {keyword:latin1(b.slice(0,z)),text:latin1(out)};\n    }catch{return null}\n}\n\nasync function parseITXT(b){\n    let p=0;\n    const kEnd=b.indexOf(0,p);\n    if(kEnd<0) return null;\n    const keyword=utf8(b.slice(p,kEnd));\n    p=kEnd+1;\n    if(p+2>b.length) return null;\n    const compressed=b[p]===1;\n    const method=b[p+1];\n    p+=2;\n    const langEnd=b.indexOf(0,p);\n    if(langEnd<0) return null;\n    p=langEnd+1;\n    const transEnd=b.indexOf(0,p);\n    if(transEnd<0) return null;\n    p=transEnd+1;\n    let text=b.slice(p);\n    if(compressed){\n        if(method!==0) return null;\n        try{text=await inflate(text)}catch{return null}\n    }\n    return {keyword,text:utf8(text)};\n}\n\nasync function inflate(b){\n    if(typeof DecompressionStream==='undefined') throw new Error('浏览器不支持解压。');\n    const stream=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'));\n    return new Uint8Array(await new Response(stream).arrayBuffer());\n}\n\nfunction latin1(b){\n    let s='';\n    const n=0x8000;\n    for(let i=0;i<b.length;i+=n) s+=String.fromCharCode(...b.subarray(i,Math.min(i+n,b.length)));\n    return s;\n}\n\nfunction utf8(b){return new TextDecoder().decode(b)}\n\nasync function decodePayload(text){\n    const t=String(text).trim();\n    const tries=[];\n\n    tries.push(()=>JSON.parse(t));\n    tries.push(()=>JSON.parse(new TextDecoder().decode(base64(t))));\n\n    for(const fn of tries){\n        try{\n            const x=await fn();\n            if(x&&typeof x==='object') return x;\n        }catch{}\n    }\n\n    return null;\n}\n\nfunction base64(t){\n    const s=atob(t.replace(/\\s+/g,''));\n    const b=new Uint8Array(s.length);\n    for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);\n    return b;\n}\n<\/script>\n\n</body>\n</html>\n";
let currentPage='homePage';
let loaded=false;
function openPage(id){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentPage=id;
  if(!loaded){
    document.getElementById('editorFrame').srcdoc=EDITOR_HTML;
    document.getElementById('importFrame').srcdoc=IMPORT_HTML;
    loaded=true;
  }
}
function goHome(){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('homePage').classList.add('active');
  currentPage='homePage';
}
window.goBackToHome=function(){
  if(currentPage==='homePage') return false;
  goHome();
  return true;
};
